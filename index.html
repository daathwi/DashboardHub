<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Business Dashboards - Professional Analytics & Data Visualization Platform</title>
    <meta name="title" content="Business Dashboards - Professional Analytics & Data Visualization Platform" />
    <meta name="description" content="Comprehensive business dashboard system with 7 interactive dashboards for Sales, Analytics, Finance, Marketing, Customer Tracking, and more. Fully responsive with real-time data visualization." />
    <meta name="keywords" content="business dashboards, analytics dashboard, sales dashboard, finance dashboard, data visualization, business intelligence, dashboard templates, React dashboard" />
    <meta name="author" content="Daathwi" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://business-dashboards.vercel.app/" />
    <meta property="og:title" content="Business Dashboards - Professional Analytics Platform" />
    <meta property="og:description" content="Comprehensive business dashboard system with 7 interactive dashboards. Fully responsive with real-time data visualization." />
    <meta property="og:image" content="https://business-dashboards.vercel.app/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://business-dashboards.vercel.app/" />
    <meta property="twitter:title" content="Business Dashboards - Professional Analytics Platform" />
    <meta property="twitter:description" content="Comprehensive business dashboard system with 7 interactive dashboards. Fully responsive with real-time data visualization." />
    <meta property="twitter:image" content="https://business-dashboards.vercel.app/og-image.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb" />
    
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Business Dashboards",
      "description": "Professional business dashboard system with interactive analytics and data visualization",
      "url": "https://business-dashboards.vercel.app",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Daathwi"
      }
    }
    </script>
    
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f9fafb;
      }
      #root {
        min-height: 100vh;
        width: 100%;
      }
      /* Fallback if React doesn't load */
      #root:empty::before {
        content: "Loading...";
        display: block;
        padding: 20px;
        color: #333;
      }
      /* Skip to main content link for accessibility */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #2563eb;
        color: white;
        padding: 8px 16px;
        text-decoration: none;
        z-index: 100;
        border-radius: 0 0 4px 0;
      }
      .skip-link:focus {
        top: 0;
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
